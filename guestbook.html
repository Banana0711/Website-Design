    <div class="detail-hero-inner">
      <p class="eyebrow">CHAPTER 05 · GUESTBOOK · 留言</p>
      <h1>把话留给河海</h1>
      <p class="detail-lede">一百一十年，河水带走很多，也留下很多。写下一句话，让它顺着水，流向下一个百年。</p>
      <p class="detail-meta"><span>GUESTBOOK</span><i></i><span>百十华诞</span><i></i><span>1915 — 2026</span></p>
    </div>
  </div>

  <!-- ============ 留言墙 ============ -->
  <section class="guestbook-body" aria-label="留言墙">
    <div class="guest-grid">
      <form class="guest-form" id="guestForm" autocomplete="off">
        <label class="field">
          <span>你的名字</span>
          <input id="guestName" name="name" type="text" maxlength="12" placeholder="一位水之子" required>
        </label>
        <label class="field">
          <span>想说的话 <em id="charCount">0 / 60</em></span>
          <textarea id="guestText" name="text" maxlength="60" rows="3" placeholder="写下你与河海的一滴水……" required></textarea>
        </label>
        <button class="btn-send btn-duo" type="submit">
          <span class="duo">
            <span class="duo-a">投入河中</span>
            <span class="duo-b" aria-hidden="true">投入河中</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <p class="form-note">留言保存在本机浏览器中，仅用于赛事演示。</p>
      </form>

      <div class="guest-stream">
        <div class="stream-head">
          <span>最近的漂流瓶</span>
          <i></i>
          <span id="guestCount">0 条</span>
        </div>
        <ul class="guest-list" id="guestList"></ul>
      </div>
    </div>
  </section>
