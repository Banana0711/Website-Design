<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>河海 · 3D 证言墙</title>
<style>
  :root {
    --bg-center: #0E6CC0;
    --bg-mid: #04457E;
    --bg-edge: #012A4D;
    --bg-deep: #00121F;
    --card-bg: rgba(4, 16, 30, .82);
    --card-line: rgba(255, 255, 255, .08);
    --card-line-hover: rgba(120, 200, 255, .45);
    --text: #E9F1FA;
    --text-dim: #8FA9C4;
    --accent: #6FC8FF;
    --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: radial-gradient(120% 90% at 50% 32%,
      var(--bg-center) 0%,
      var(--bg-mid) 34%,
      var(--bg-edge) 66%,
      var(--bg-deep) 100%);
    font-family: var(--font);
    color: var(--text);
  }

  /* 极细噪点，让蓝色背景有质感 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .035;
    z-index: 9;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.9'/></svg>");
  }

  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    perspective: 1300px;
    perspective-origin: 50% 42%;
  }

  .wall {
    --mx: 0px;
    --my: 0px;
    display: flex;
    gap: 28px;
    transform:
      translate3d(var(--mx), var(--my), 0)
      rotateX(26deg)
      rotateZ(-13deg)
      scale(1.3);
    transform-style: preserve-3d;
    opacity: 0;
    transition: opacity .9s ease;
    will-change: transform;
  }

  .wall.is-ready { opacity: 1; }

  .col {
    flex: 0 0 auto;
    width: var(--w, 300px);
    animation: drift var(--dur, 26s) linear infinite;
    animation-delay: var(--delay, 0s);
    --rot: 10deg;
    will-change: transform;
    transform-origin: 50% 50%;
  }

  /* 两侧列做轻微景深处理 */
  .col:first-child, .col:last-child {
    filter: blur(.7px);
    opacity: .88;
  }

  .col:hover { animation-play-state: paused; }

  /* 列整体旋转后沿本地 Y 轴平移，视觉上就是右上方 → 左下方的斜向流动 */
  @keyframes drift {
    from { transform: rotate(var(--rot)) translate3d(0, -50%, 0); }
    to   { transform: rotate(var(--rot)) translate3d(0, 0, 0); }
  }

  .card {
    position: relative;
    padding: 18px 20px 20px;
    margin-bottom: 18px;
    border: 1px solid var(--card-line);
    border-radius: 18px;
    background: var(--card-bg);
    box-shadow: 0 18px 38px rgba(0, 6, 14, .38);
    transform: rotateY(var(--ry, 0deg)) rotateZ(var(--rz, 0deg)) scale(var(--s, 1));
    transition: transform .35s ease, border-color .35s ease, background .35s ease, box-shadow .35s ease;
    transform-style: preserve-3d;
  }

  .card:nth-child(3n + 2) {
    margin-left: 20px;
    width: calc(100% - 20px);
  }

  .card:nth-child(4n + 3) {
    margin-right: 16px;
    width: calc(100% - 16px);
  }

  .card:hover {
    --s: 1.045;
    border-color: var(--card-line-hover);
    background: rgba(8, 26, 46, .92);
    box-shadow: 0 26px 54px rgba(0, 10, 24, .5), 0 0 0 1px rgba(111, 200, 255, .12) inset;
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    position: relative;
    flex: 0 0 42px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: linear-gradient(140deg, #1E74B8, #0B3F6E);
    font-size: 15px;
    font-weight: 600;
    color: #DCEBFA;
    border: 1px solid rgba(255, 255, 255, .14);
  }

  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .who {
    min-width: 0;
    line-height: 1.25;
  }

  .who strong {
    display: block;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .2px;
    color: #F2F7FC;
  }

  .who .handle {
    font-size: 12px;
    color: var(--text-dim);
  }

  .loc {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .loc .flag { font-size: 13px; }

  .quote {
    margin: 14px 0 0;
    font-size: 15.5px;
    line-height: 1.55;
    color: #DCE8F4;
    letter-spacing: .2px;
  }

  /* 上下 / 四周渐隐，避免边缘生硬截断 */
  .fade {
    position: fixed;
    left: 0;
    right: 0;
    height: 20vh;
    pointer-events: none;
    z-index: 5;
  }

  .fade-top {
    top: 0;
    background: linear-gradient(to bottom, rgba(1, 18, 31, .96), rgba(1, 18, 31, .55) 45%, transparent);
  }

  .fade-bottom {
    bottom: 0;
    background: linear-gradient(to top, rgba(1, 18, 31, .96), rgba(1, 18, 31, .55) 45%, transparent);
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 6;
    background: radial-gradient(115% 95% at 50% 48%, transparent 52%, rgba(0, 8, 18, .6) 100%);
  }

  @media (max-width: 1024px) {
    .wall { gap: 22px; scale: 1.05; }
    .col:nth-child(4) { display: none; }
    .col { width: 44vw; }
  }

  @media (max-width: 640px) {
    .wall { scale: 1; }
    .col:nth-child(3) { display: none; }
    .col { width: 78vw; }
    .quote { font-size: 14.5px; }
  }

</style>
</head>
<body>
  <main class="stage">
    <div class="wall" id="wall" aria-label="河海大学证言墙"></div>
  </main>
  <div class="fade fade-top" aria-hidden="true"></div>
  <div class="fade fade-bottom" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

<script>
  var QUOTES = [
    { name: "陈知远", handle: "@zhiyuan", flag: "🇨🇳", place: "CN · 南京", quote: "从长江口到实验室，每一滴水都有答案。", img: "assets/img/avatars/m32.jpg" },
    { name: "林清越", handle: "@qingyue", flag: "🇨🇳", place: "CN · 苏州", quote: "在这里，学会让数据开口说话。", img: "assets/img/avatars/w44.jpg" },
    { name: "苏晚舟", handle: "@wanzhou", flag: "🇨🇳", place: "CN · 南京", quote: "百年的闸门一开，青春就流进了江海。", img: "assets/img/avatars/w65.jpg" },
    { name: "何疏影", handle: "@shuying", flag: "🇨🇳", place: "CN · 扬州", quote: "把论文写在祖国的大江大河上。", img: "assets/img/avatars/w68.jpg" },
    { name: "顾行舟", handle: "@xingzhou", flag: "🇨🇳", place: "CN · 南通", quote: "模型里的每次涨落，都是真实世界的预演。", img: "assets/img/avatars/m75.jpg" },
    { name: "江语棠", handle: "@yutang", flag: "🇨🇳", place: "CN · 武汉", quote: "在河海，连风都带着水汽的浪漫。", img: "assets/img/avatars/w26.jpg" },
    { name: "Ade", handle: "@ade", flag: "🇳🇬", place: "NG · Lagos", quote: "这里的江河教会我，水从不拒绝任何人。", img: "assets/img/avatars/m22.jpg" },
    { name: "沈墨白", handle: "@mobai", flag: "🇨🇳", place: "CN · 杭州", quote: "用一行行代码，给河流做一次数字体检。", img: "assets/img/avatars/m45.jpg" },
    { name: "陆听澜", handle: "@tinglan", flag: "🇨🇳", place: "CN · 南京", quote: "治水先治心，问渠那得清如许。", img: "assets/img/avatars/w50.jpg" },
    { name: "Sana", handle: "@sana", flag: "🇵🇰", place: "PK · Lahore", quote: "我想把这里的治水经验带回故乡。", img: "assets/img/avatars/w9.jpg" },
    { name: "唐见山", handle: "@jianshan", flag: "🇨🇳", place: "CN · 重庆", quote: "从一粒沙，看见一整条河。", img: "assets/img/avatars/m11.jpg" },
    { name: "Lukas", handle: "@lukas", flag: "🇩🇪", place: "DE · München", quote: "坝体、闸门与水位，每一课都像打开一扇窗。", img: "assets/img/avatars/m3.jpg" }
  ];

  var COLUMNS = [
    { width: 300, dur: 26, delay: -4, offset: 0, shift: -70, rot: 10 },
    { width: 278, dur: 20, delay: -11, offset: 3, shift: 30, rot: 8 },
    { width: 312, dur: 24, delay: -7, offset: 6, shift: -120, rot: 12 },
    { width: 286, dur: 30, delay: -16, offset: 9, shift: 80, rot: 9 }
  ];

  function makeCard(item, index) {
    var card = document.createElement("article");
    card.className = "card";
    /* 轻微随机倾斜，像贴在墙上的便签 */
    card.style.setProperty("--ry", ((index % 5) - 2) * 3 + "deg");
    card.style.setProperty("--rz", ((index % 4) - 1.5) * 1.6 + "deg");

    var head = document.createElement("header");
    head.className = "card-head";

    var avatar = document.createElement("div");
    avatar.className = "avatar";
    var initial = document.createElement("span");
    initial.textContent = item.name.slice(0, 1);
    var photo = document.createElement("img");
    photo.src = item.img;
    photo.alt = "";
    photo.loading = "lazy";
    photo.onerror = function () { photo.remove(); };
    avatar.appendChild(initial);
    avatar.appendChild(photo);
    head.appendChild(avatar);

    var who = document.createElement("div");
    who.className = "who";
    var name = document.createElement("strong");
    name.textContent = item.name;
    var handle = document.createElement("span");
    handle.className = "handle";
    handle.textContent = item.handle;
    who.appendChild(name);
    who.appendChild(handle);
    head.appendChild(who);

    var loc = document.createElement("div");
    loc.className = "loc";
    var flag = document.createElement("span");
    flag.className = "flag";
    flag.textContent = item.flag;
    var place = document.createElement("span");
    place.textContent = item.place;
    loc.appendChild(flag);
    loc.appendChild(place);
    head.appendChild(loc);

    var quote = document.createElement("p");
    quote.className = "quote";
    quote.textContent = "“" + item.quote + "”";

    card.appendChild(head);
    card.appendChild(quote);
    return card;
  }

  var wall = document.getElementById("wall");

  COLUMNS.forEach(function (spec) {
    var col = document.createElement("div");
    col.className = "col";
    col.style.setProperty("--w", spec.width + "px");
    col.style.setProperty("--dur", spec.dur + "s");
    col.style.setProperty("--delay", spec.delay + "s");
    col.style.setProperty("--rot", spec.rot + "deg");
    col.style.marginTop = spec.shift + "px";

    /* 每列从不同位置开始，避免左右出现重复卡片；复制两份配合 -50% 位移实现无缝循环 */
    var ordered = QUOTES.slice(spec.offset).concat(QUOTES.slice(0, spec.offset));
    for (var copy = 0; copy < 2; copy++) {
      ordered.forEach(function (item, i) {
        col.appendChild(makeCard(item, i + spec.width));
      });
    }
    wall.appendChild(col);
  });

  requestAnimationFrame(function () { wall.classList.add("is-ready"); });

  /* 鼠标视差：整墙反向轻微位移 */
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    var tx = 0, ty = 0, cx = 0, cy = 0, ticking = false;

    function render() {
      cx += (tx - cx) * .08;
      cy += (ty - cy) * .08;
      wall.style.setProperty("--mx", cx.toFixed(2) + "px");
      wall.style.setProperty("--my", cy.toFixed(2) + "px");
      if (Math.abs(tx - cx) > .1 || Math.abs(ty - cy) > .1) {
        requestAnimationFrame(render);
      } else {
        ticking = false;
      }
    }

    window.addEventListener("pointermove", function (e) {
      tx = (e.clientX / window.innerWidth - .5) * -8;
      ty = (e.clientY / window.innerHeight - .5) * -5;
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(render);
      }
    }, { passive: true });
  }
</script>
</body>
</html>
